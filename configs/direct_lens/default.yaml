model:
  model_name: "vit_large_patch14_clip_224.openai_ft_in1k"
  pretrained: true
  weights_path: null
  head_weights_path: null
  target_layer: 22        # single layer per run; override with --target-layer
  freeze_model: true

precompute:
  imagenet_root: "/opt/models/datasets/imagenet/extracted"
  max_images_per_class: 500       # 500 * 1000 classes = 500K train images → ~263 GB
  val_max_images_per_class: 10    # 10 * 1000 classes = 10K val images   → ~5.2 GB on GPU
  chunk_size: 50000               # images per on-disk chunk (~26 GB each)
  precompute_batch_size: 256      # backbone batch size during pre-computation
  num_workers: 16
  cache_dir: "outputs/direct_lens/cache"

lens:
  lens_type: "embedding"    # "embedding" (d_model→d_model) | "direct" (d_model→num_classes)
  bias: true

training:
  lens_batch_size: 32768    # tokens per gradient step
  num_epochs: 50
  lr: 1.0e-3
  weight_decay: 0.0
  optimizer: "adam"         # "adam" | "adamw" | "sgd"
  loss_type: "kld"          # "kld" | "ce" | "combined"
  ce_weight: 0.1
  temperature: 1.0
  grad_clip_norm: 1.0
  val_interval: 5           # validate every N epochs
  scheduler: "plateau"      # "plateau" | "none"
  scheduler_patience: 3     # epochs with no train-loss improvement before reducing LR
  scheduler_factor: 0.5     # multiply LR by this on each reduction
  scheduler_min_lr: 1.0e-7  # LR floor

output_dir: "outputs/direct_lens/layer22"
seed: 42
