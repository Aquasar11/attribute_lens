[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attribute-lens"
version = "0.1.0"
description = "Tuned lens training for vision transformer interpretability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "timm>=1.0",
    "pytorch-lightning>=2.0",
    "optuna>=3.0",
    "pyyaml",
    "safetensors",
    "tensorboard",
    "pillow",
    "matplotlib",
    "scikit-learn",
    "numpy",
    "pandas",
    "opencv-python",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]

[project.scripts]
tuned-lens-train = "train.tuned_lens.scripts.train:main"
prepare-imagenet = "train.tuned_lens.scripts.prepare_imagenet:main"
direct-lens-train = "train.direct_lens.train:main"
unified-lens-train-v1 = "train.unified_lens.trainv1:main"
unified-lens-train-v2 = "train.unified_lens.trainv2:main"
faithfulness-eval = "eval.faithfulness:main"
localization-eval = "eval.localization:main"
y-hat-create = "eval.y_hat_creator:main"

[tool.setuptools.packages.find]
where = ["src"]
